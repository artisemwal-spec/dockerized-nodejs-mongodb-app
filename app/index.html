<html>
<script>
        function editProfile(){
                document.querySelector('.container').style.display = 'none'
                document.querySelector('.container-edit').style.display = 'block'

                const name = document.querySelector('#name').textContent
                document.querySelector('#input-name').value = name

                const email = document.querySelector('#email').textContent
                document.querySelector('#input-email').value = email

                const interests = document.querySelector('#interests').textContent
                document.querySelector('#input-interests').value = interests
        }


        function saveProfile(){

                const name = document.querySelector('#input-name').value
                const email = document.querySelector('#input-email').value
                const interests = document.querySelector('#input-interests').value

                /* 🔴 CHANGE 1: ADD API CALL */
                fetch('/update-profile', {
                        method: 'POST',
                        headers: {
                                'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                                name: name,
                                email: email,
                                interests: interests
                        })
                })
                .then(res => res.json())
                .then(data => {

                        /* 🔴 CHANGE 2: UPDATE UI AFTER RESPONSE */
                        document.querySelector('#name').textContent = data.name
                        document.querySelector('#email').textContent = data.email
                        document.querySelector('#interests').textContent = data.interests

                        document.querySelector('.container').style.display = 'block'
                        document.querySelector('.container-edit').style.display = 'none'
                })
                .catch(err => console.log(err))

        }


        /* 🔴 CHANGE 3: LOAD DATA FROM DB ON PAGE LOAD */
        window.onload = function(){
                fetch('/get-profile')
                .then(res => res.json())
                .then(data => {
                        if(data){
                                document.querySelector('#name').textContent = data.name || 'Arti Semwal'
                                document.querySelector('#email').textContent = data.email || 'arti.semwal@example.com'
                                document.querySelector('#interests').textContent = data.interests || 'coding'
                        }
                })
        }
</script>

<style>

.container img, .container-edit img {
    width: 400px;
    height: auto;
}

.container-edit {
    display: none;
}

#name, #email, #interests {
    font-weight: bold;
}

</style>

<body>
        <div class='container'>
                <h1 id='header'>User Profile</h1>
                <img src='test.jpg'/>
                <br><br>
                Name: <span id='name'>Arti Semwal</span>
                <hr />
                Email: <span id='email'>arti.semwal@example.com</span>
                <hr />
                Interests: <span id='interests'>coding</span>
                <hr />
                <button class='button' onclick="editProfile()">Edit Profile</button>
        </div>

        <div class='container-edit'>
                <h1 id='header'>User Profile</h1>
                <img src='test.jpg'/>
                <br><br>
                Name: <input id='input-name' type='text' />
                <hr />
                Email: <input id='input-email' type='email'/>
                <hr />
                Interests: <input id='input-interests' type='text'>
                <hr />
                <button class='button' onclick="saveProfile()">Save Profile</button>
        </div>
</body>
</html>
